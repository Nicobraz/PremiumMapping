# Render blueprint: New > Blueprint, point it at this repo.
# Free plan: the server's disk is wiped whenever it sleeps, so the data lives
# in a free Neon Postgres database. Paste its connection string as DATABASE_URL.
services:
  - type: web
    name: pss-connect
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Keep a single worker: the app caches the map version in memory. Eight threads
    # leave room for AI assistant replies, which stream for up to a minute.
    startCommand: gunicorn app:app --workers 1 --threads 8 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      # Password for the ⚙ admin panel (manage reps).
      - key: ADMIN_PASSWORD
        sync: false
